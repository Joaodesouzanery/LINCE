# Enriquecimento do quadro societario (QSA) das empresas ja no banco.
# Roda AQUI (GitHub Actions), nao no Vercel: agendamento diario que o Hobby nao
# permite (2 crons ja usados por ingest-dou/ingest-people-dou) + tolera o job
# longo do throttle do CNPJ.ws gratuito (~3 req/min). Gratis (runner Ubuntu).
#
# O QSA e o elo que DESTRAVA as correlacoes: liga o `person_id` de um diretor
# (people, via normalized_key) a empresa da qual ele e socio -> alimenta
# self-dealing / porta-giratoria (api/intelligence.js). --only-empty processa
# so quem ainda nao tem socios; a cada rodada avanca a fila (PNCP traz fornecedores novos).
#
# PRE-REQUISITOS (uma vez): em Settings > Secrets and variables > Actions do repo:
#   SUPABASE_URL         -> a Project URL do Supabase do LINCE
#   SUPABASE_SERVICE_KEY -> a service_role key do LINCE
name: enriquecer-qsa

on:
  schedule:
    # 2x/dia. A fila e grande e o gargalo e o throttle do CNPJ.ws (~21s/empresa),
    # nao o runner: 130 empresas ~= 46 min, dentro do timeout de 60.
    - cron: "42 9 * * *"  # ~06:42 BRT, apos os crons de ingestao
    - cron: "42 21 * * *" # ~18:42 BRT
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximo de empresas por rodada (throttle ~21s/empresa)"
        required: false
        default: "130"

concurrency:
  group: enriquecer-qsa
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar deps do projeto
        run: npm ci --no-audit --no-fund
      - name: Rodar backfill de QSA (only-empty)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backfill-qsa.js --only-empty --limit ${{ github.event.inputs.limit || '130' }}

      # Quanto ainda falta. Sem isso nao da para saber se a fila esta andando ou
      # parada -- e "fila parada em silencio" foi exatamente a causa do furo do
      # acervo do DOU.
      - name: Reportar fila restante
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          require('dotenv').config();
          const { createClient } = require('@supabase/supabase-js');
          const s = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
          (async () => {
            const { count: total } = await s.from('companies').select('id',{count:'exact',head:true});
            const { count: vazias } = await s.from('companies').select('id',{count:'exact',head:true}).eq('shareholding','[]');
            const feitas = total - vazias;
            console.log('QSA: ' + feitas + '/' + total + ' empresas enriquecidas (' + Math.round(100*feitas/total) + '%). Faltam ' + vazias + '.');
            if (vazias > 0) console.log('Restam ~' + Math.ceil(vazias/130) + ' rodada(s) (2 por dia).');
          })();
          "
