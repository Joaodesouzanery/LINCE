# F-INT1 (Frente 4) — alimentadores da camada de inteligência que ANTES eram só
# manuais e envelheciam em silêncio: contratos PNCP (grafo/radar/giratória/score de
# patrocinador), temas dos atos, agenda regulatória formal e dumps do TSE.
# Roda AQUI (GitHub Actions): os 2 crons e as 12 funções do Vercel Hobby já estão no limite.
#
# PRÉ-REQUISITOS (uma vez): Settings > Secrets and variables > Actions:
#   SUPABASE_URL / SUPABASE_SERVICE_KEY (mesmos dos outros workflows)
#   ANTHROPIC_API_KEY (OPCIONAL — só melhora a extração da agenda; sem ela usa heurística)
name: inteligencia

on:
  schedule:
    - cron: "45 12 * * *" # diário ~12:45 UTC (depois do cron do DOU 12:00/12:30): PNCP + temas
    - cron: "15 11 * * 2" # semanal (terça): agenda regulatória formal
  workflow_dispatch: {}

concurrency:
  group: inteligencia
  cancel-in-progress: false

jobs:
  diario:
    # PNCP (janela móvel de 45 dias; dedup por pncp_id) + temas incrementais (só sem tema).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar deps do projeto
        run: npm ci --no-audit --no-fund
      - name: Contratos PNCP (janela móvel de 45 dias)
        run: node scripts/run-ingest-pncp.js "$(date -u -d '45 days ago' +%Y%m%d)" "$(date -u +%Y%m%d)"
      - name: Temas dos atos (incremental, só sem tema)
        run: node scripts/backfill-themes.js --limit 2000

  agenda:
    # Agenda Regulatória formal (temas itemizados por agência). IA opcional.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 11 * * 2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar deps do projeto
        run: npm ci --no-audit --no-fund
      - name: Agenda regulatória formal (regulatory_agenda)
        run: node scripts/load-agenda.js --limit 30

# NOTA: os loaders do TSE (load-tse-doacoes/load-tse-bens) exigem os CSVs dos dumps
# BAIXADOS LOCALMENTE (--receitas/--cand/--bens) — por desenho, rodam como runbook
# manual (dados eleitorais mudam entre eleições, não entre meses). Não entram aqui.
